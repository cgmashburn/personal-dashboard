<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bills</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22252A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bills">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500&display=swap');

  :root {
    --paper: #F5F3ED;
    --paper-raised: #FCFBF8;
    --ink: #22252A;
    --ink-soft: #5B5E58;
    --line: #D8D4C8;
    --paid: #1F6F5C;
    --paid-bg: #E4EFEA;
    --due: #B9762A;
    --due-bg: #F5E9D8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 3rem;
  }

  header {
    position: sticky;
    top: 0;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 1.1rem 1.25rem 0.9rem;
    z-index: 10;
  }

  h1 {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 1.5rem;
    margin: 0 0 0.15rem;
    letter-spacing: -0.01em;
  }

  .sub {
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin: 0 0 0.85rem;
  }

  select {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--ink);
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
  }

  .halves {
    display: flex;
    gap: 0.4rem;
    margin-top: 0.7rem;
  }

  .half-btn {
    flex: 1;
    text-align: center;
    padding: 0.6rem 0;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--ink-soft);
  }

  .half-btn.active {
    background: var(--ink);
    color: var(--paper-raised);
    border-color: var(--ink);
  }

  main { padding: 1rem 1.25rem; }

  .summary {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 1.4rem;
  }

  .stat {
    flex: 1;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.7rem 0.8rem;
  }

  .stat .label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    margin-bottom: 0.25rem;
  }

  .stat .value {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 1.15rem;
  }

  .section-title {
    font-family: 'Lora', serif;
    font-size: 1rem;
    font-weight: 600;
    margin: 1.4rem 0 0.5rem;
    color: var(--ink);
  }

  .section-title:first-of-type { margin-top: 0; }

  .bill-header {
    display: grid;
    grid-template-columns: 2.4rem 1fr 4.2rem 1rem 5.2rem;
    gap: 0.5rem;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    padding-bottom: 0.45rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 0.15rem;
  }

  .bill-header .amount-col { text-align: right; }
  .bill-header .status-col { text-align: right; }

  .bill {
    display: grid;
    grid-template-columns: 2.4rem 1fr 4.2rem 1rem 5.2rem;
    gap: 0.5rem;
    align-items: center;
    padding: 0.7rem 0;
    border-bottom: 1px dotted var(--line);
  }

  .bill:last-child { border-bottom: none; }

  .bill-name-wrap {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    min-width: 0;
  }

  .bill-name {
    font-size: 1rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .type-marker {
    flex-shrink: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem;
    font-weight: 500;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 4px;
    width: 1.1rem;
    height: 1.1rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .bill-amount {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    font-weight: 500;
    white-space: nowrap;
    text-align: right;
  }

  .bill-controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.6rem;
  }

  .status-dot {
    width: 1.05rem;
    height: 1.05rem;
    border-radius: 50%;
    display: inline-block;
    border: none;
    outline: none;
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    line-height: 0;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
  }

  .status-dot::before {
    content: '';
    position: absolute;
    top: -13px;
    bottom: -13px;
    left: -7px;
    right: -7px;
  }

  .status-dot.due { background: #B23B3B; }
  .status-dot.pending { background: var(--due); }
  .status-dot.paid { background: var(--paid); }
  .status-dot.skipped { background: #B7B3A6; cursor: default; }

  .bill-due {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .tap-target {
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.25rem 0.55rem;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--ink-soft);
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
  }

  .tap-target.paid {
    background: var(--paid-bg);
    color: var(--paid);
    border-color: var(--paid);
  }

  .tap-target.pending {
    background: var(--due-bg);
    color: var(--due);
    border-color: var(--due);
  }

  .skip-link {
    background: none;
    border: none;
    font-size: 0.78rem;
    color: var(--ink-soft);
    text-decoration: underline;
    padding: 0.4rem 0.35rem;
    font-family: 'Inter', sans-serif;
  }

  .skip-link.active {
    color: #B7B3A6;
    text-decoration: none;
  }

  .edit-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 1.05rem;
    padding: 0.4rem 0.3rem;
    cursor: pointer;
  }

  .edit-row {
    display: flex;
    gap: 0.4rem;
    align-items: center;
    padding: 0.55rem 0;
    border-bottom: 1px dotted var(--line);
  }

  .edit-row input {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 0.3rem 0.5rem;
    background: var(--paper-raised);
    color: var(--ink);
  }

  .edit-row input.edit-name { flex: 1; min-width: 0; }
  .edit-row input.edit-amount { width: 5.5rem; font-family: 'IBM Plex Mono', monospace; }

  .edit-row button {
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    border-radius: 6px;
    padding: 0.3rem 0.6rem;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink-soft);
  }

  .edit-row button.save {
    background: var(--paid);
    color: var(--paper-raised);
    border-color: var(--paid);
  }

  .auto-tag {
    font-size: 0.68rem;
    color: var(--ink-soft);
    white-space: nowrap;
    padding: 0.2rem 0;
  }

  .skip .bill-due,
  .skip .bill-name,
  .skip .bill-amount {
    color: #8B8E85;
  }

  .loading, .error {
    padding: 2rem 0;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  .error { color: var(--due); }
</style>
</head>
<body>

<div id="lock-screen" style="display:none; padding: 3rem 1.5rem; text-align:center;">
  <h1 style="margin-bottom:0.5rem;">Bills</h1>
  <p class="sub" style="margin-bottom:1.2rem;">Enter your code to continue.</p>
  <input id="lock-input" type="text" inputmode="numeric" autofocus style="font-family:'IBM Plex Mono',monospace; font-size:1.1rem; text-align:center; padding:0.6rem; border:1px solid var(--line); border-radius:6px; width:140px; background:var(--paper-raised); color:var(--ink);">
  <div>
    <button id="lock-submit" class="tap-target" style="margin-top:0.9rem; padding:0.5rem 1.4rem;">Continue</button>
  </div>
  <p id="lock-error" style="color:var(--due); font-size:0.8rem; margin-top:0.8rem; display:none;">Wrong code. Try again.</p>
</div>

<div id="app-shell" style="display:none;">
<header>
  <div style="display:flex; gap:0.5rem; align-items:center;">
    <select id="month-select"></select>
    <button id="refresh-btn" class="tap-target" style="margin-left:auto;">Refresh</button>
  </div>
  <div class="halves">
    <div class="half-btn active" id="half1-btn">1st half</div>
    <div class="half-btn" id="half2-btn">2nd half</div>
  </div>
</header>

<main>
  <div class="summary">
    <div class="stat">
      <div class="label">Due this half</div>
      <div class="value" id="stat-due">—</div>
    </div>
    <div class="stat">
      <div class="label">Paid so far</div>
      <div class="value" id="stat-paid">—</div>
    </div>
    <div class="stat">
      <div class="label">Remaining</div>
      <div class="value" id="stat-remaining">—</div>
    </div>
  </div>

  <div id="bill-list">
    <div class="loading">Loading bills…</div>
  </div>

  <div style="display:flex; gap:0.6rem; margin-top:1.4rem;">
    <div class="stat">
      <div class="label">Flex (adjusted for this month)</div>
      <div class="value" id="stat-flex">—</div>
    </div>
    <div class="stat">
      <div class="label">Flex (typical month)</div>
      <div class="value" id="stat-flex-baseline">—</div>
    </div>
  </div>
</main>
</div>

<script>
  // ---- Set this once to your Apps Script /exec URL ----
  const API_URL = 'https://script.google.com/macros/s/AKfycby0mekxXNIb8itgyTWR8PSAe8fU0jI14CP4ua3HrnQBU0oF4FMVdX0SRZQTRJ0HcOY/exec';

  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

  let currentMonth = MONTHS[new Date().getMonth()];
  let currentHalf = new Date().getDate() <= 15 ? 1 : 2;
  let allBills = [];
  let incomeByHalf = { 1: null, 2: null };
  let flexBaselineByHalf = { 1: null, 2: null };
  let editingRow = null;

  async function saveEdit(row, name, amount) {
    try {
      const res = await fetch(`${API_URL}?action=editBill&row=${row}&name=${encodeURIComponent(name)}&amount=${encodeURIComponent(amount)}&token=${encodeURIComponent(getToken())}`);
      const data = await res.json();
      if (data.ok === false && data.error === 'Not authorized') {
        localStorage.removeItem('billsToken');
        showLock(true);
        return;
      }
      if (data.ok) {
        const bill = allBills.find(b => b.row === row);
        if (bill) { bill.name = data.name; bill.amount = data.amount; }
        editingRow = null;
        render();
      } else {
        alert(data.error || "Couldn't save changes.");
      }
    } catch (err) {
      alert("Couldn't save changes. Check your connection and try again.");
    }
  }

  function getToken() {
    return localStorage.getItem('billsToken') || '';
  }

  function showApp() {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app-shell').style.display = 'block';
    setHalf(currentHalf);
    loadBills();
    setInterval(() => loadBills(true), 30000);
  }

  function showLock(wrongCode) {
    document.getElementById('app-shell').style.display = 'none';
    document.getElementById('lock-screen').style.display = 'block';
    document.getElementById('lock-error').style.display = wrongCode ? 'block' : 'none';
    document.getElementById('lock-input').focus();
  }

  document.getElementById('lock-submit').addEventListener('click', submitCode);
  document.getElementById('lock-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitCode();
  });

  let autoSubmitTimer = null;
  document.getElementById('lock-input').addEventListener('input', () => {
    clearTimeout(autoSubmitTimer);
    const val = document.getElementById('lock-input').value.trim();
    if (val) {
      autoSubmitTimer = setTimeout(submitCode, 600);
    }
  });

  function submitCode() {
    const val = document.getElementById('lock-input').value.trim();
    if (!val) return;
    localStorage.setItem('billsToken', val);
    showApp();
  }

  if (getToken()) {
    showApp();
  } else {
    showLock(false);
  }

  const monthSelect = document.getElementById('month-select');
  MONTHS.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    if (m === currentMonth) opt.selected = true;
    monthSelect.appendChild(opt);
  });

  monthSelect.addEventListener('change', () => {
    currentMonth = monthSelect.value;
    loadBills();
  });

  document.getElementById('half1-btn').addEventListener('click', () => setHalf(1));
  document.getElementById('half2-btn').addEventListener('click', () => setHalf(2));

  function setHalf(half) {
    currentHalf = half;
    document.getElementById('half1-btn').classList.toggle('active', half === 1);
    document.getElementById('half2-btn').classList.toggle('active', half === 2);
    render();
  }

  async function loadBills(isBackground) {
    if (!isBackground) {
      document.getElementById('bill-list').innerHTML = '<div class="loading">Loading bills…</div>';
    }
    try {
      const res = await fetch(`${API_URL}?month=${currentMonth}&token=${encodeURIComponent(getToken())}`);
      if (!res.ok) throw new Error('Request failed: ' + res.status);
      const data = await res.json();
      if (data.ok === false && data.error === 'Not authorized') {
        localStorage.removeItem('billsToken');
        showLock(true);
        return;
      }
      allBills = data.bills;
      incomeByHalf = data.income || { 1: null, 2: null };
      flexBaselineByHalf = data.flexBaseline || { 1: null, 2: null };
      render();
    } catch (err) {
      if (!isBackground) {
        document.getElementById('bill-list').innerHTML =
          `<div class="error">Couldn't load bills. ${err.message}</div>`;
      }
    }
  }

  async function setStatus(row, newValue) {
    try {
      const res = await fetch(`${API_URL}?action=setStatus&row=${row}&value=${encodeURIComponent(newValue)}&token=${encodeURIComponent(getToken())}`);
      const data = await res.json();
      if (data.ok === false && data.error === 'Not authorized') {
        localStorage.removeItem('billsToken');
        showLock(true);
        return;
      }
      if (data.ok) {
        const bill = allBills.find(b => b.row === row);
        if (bill) bill.status = data.newValue;
        render();
      }
    } catch (err) {
      alert("Couldn't update that bill. Check your connection and try again.");
    }
  }

  function render() {
    const bills = allBills.filter(b => b.half === currentHalf);
    const container = document.getElementById('bill-list');

    if (bills.length === 0) {
      container.innerHTML = '<div class="loading">No bills found for this period.</div>';
    } else {
      const sections = {};
      bills.forEach(b => {
        if (!sections[b.section]) sections[b.section] = [];
        sections[b.section].push(b);
      });

      let html = '';
      Object.keys(sections).forEach(section => {
        html += `<div class="section-title">${section}</div>`;
        html += `<div class="bill-header"><span>Day</span><span>Bill</span><span class="amount-col">Amount</span><span></span><span class="status-col">Status</span></div>`;
        sections[section].forEach(b => {
          if (editingRow === b.row) {
            html += `
              <div class="edit-row">
                <input class="edit-name" id="edit-name-${b.row}" type="text" value="${b.name.replace(/"/g, '&quot;')}">
                <input class="edit-amount" id="edit-amount-${b.row}" type="number" step="0.01" value="${b.amount}">
                <button class="save" data-save="${b.row}">Save</button>
                <button data-cancel="${b.row}">Cancel</button>
              </div>`;
            return;
          }

          const isSkip = b.status === '-';
          const amount = '$' + Math.round(b.amount).toLocaleString();

          const dotClass = isSkip ? 'skipped'
                          : b.status === 'P' ? 'pending'
                          : b.status === 'x' ? 'paid'
                          : 'due';
          const next = { '': 'P', 'P': 'x', 'x': '' }[b.status] ?? 'P';
          const dot = isSkip
            ? `<span class="status-dot ${dotClass}"></span>`
            : `<button class="status-dot ${dotClass}" data-row="${b.row}" data-value="${next}"></button>`;

          const skipBtn = `<button class="skip-link ${isSkip ? 'active' : ''}" data-row="${b.row}" data-value="${isSkip ? '' : '-'}">skip</button>`;

          html += `
            <div class="bill ${isSkip ? 'skip' : ''}">
              <span class="bill-due">${b.due}</span>
              <span class="bill-name-wrap">
                <span class="type-marker">${b.type === 'auto' ? 'A' : 'M'}</span>
                <span class="bill-name">${b.name}</span>
              </span>
              <span class="bill-amount">${amount}</span>
              <span></span>
              <span class="bill-controls">
                ${dot}
                ${skipBtn}
                <button class="edit-btn" data-edit="${b.row}">✎</button>
              </span>
            </div>`;
        });
      });
      container.innerHTML = html;

      container.querySelectorAll('button[data-row]').forEach(btn => {
        btn.addEventListener('click', () => {
          setStatus(parseInt(btn.dataset.row, 10), btn.dataset.value);
        });
      });
      container.querySelectorAll('button[data-edit]').forEach(btn => {
        btn.addEventListener('click', () => {
          editingRow = parseInt(btn.dataset.edit, 10);
          render();
        });
      });
      container.querySelectorAll('button[data-cancel]').forEach(btn => {
        btn.addEventListener('click', () => {
          editingRow = null;
          render();
        });
      });
      container.querySelectorAll('button[data-save]').forEach(btn => {
        btn.addEventListener('click', () => {
          const row = parseInt(btn.dataset.save, 10);
          const name = document.getElementById(`edit-name-${row}`).value.trim();
          const amount = document.getElementById(`edit-amount-${row}`).value;
          if (!name || amount === '') { alert('Name and amount are both required.'); return; }
          saveEdit(row, name, amount);
        });
      });
    }

    const relevant = bills.filter(b => b.status !== '-');
    const due = relevant.reduce((sum, b) => sum + b.amount, 0);
    const paid = relevant.filter(b => b.status === 'x')
                          .reduce((sum, b) => sum + b.amount, 0);
    const remaining = due - paid;

    document.getElementById('stat-due').textContent = '$' + Math.round(due).toLocaleString();
    document.getElementById('stat-paid').textContent = '$' + Math.round(paid).toLocaleString();
    document.getElementById('stat-remaining').textContent = '$' + Math.round(remaining).toLocaleString();

    const income = incomeByHalf[currentHalf];
    const flexEl = document.getElementById('stat-flex');
    if (typeof income === 'number') {
      const flex = income - due;
      flexEl.textContent = '$' + Math.round(flex).toLocaleString();
    } else {
      flexEl.textContent = '—';
    }

    const baseline = flexBaselineByHalf[currentHalf];
    document.getElementById('stat-flex-baseline').textContent =
      typeof baseline === 'number' ? '$' + Math.round(baseline).toLocaleString() : '—';
  }

  document.getElementById('refresh-btn').addEventListener('click', loadBills);
</script>

</body>
</html>
